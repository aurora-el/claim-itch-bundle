[package]
name = "claim-itch-bundle"
version = "0.1.1"
edition = "2021"
authors = ["Aurora Long <aurora.long@tuta.io>"]
description = "A program to automate claiming itch.io games purchased as part of large bundles"
license-file = "LICENSE"
repository = "https://github.com/aurora-el/claim-itch-bundle.git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fantoccini = { version = "0.19", features = ["rustls-tls"] }
tokio = { version = "1.26", features = ["full"] }
clap = {version = "4.1", features = ["derive"] }
serde_json = "1.0"
